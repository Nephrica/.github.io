<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Members | Nephrica Consortium</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background-color: #f4f1f7;
  color: #4b2e83;
}

header {
  border-bottom: 1px solid #dfd3ee;
  padding: 24px 0;
}

nav {
  display: flex;
  justify-content: center;
  gap: 40px;
}

nav a {
  text-decoration: none;
  color: #4b2e83;
  font-weight: bold;
  padding-bottom: 4px;
}

nav a:hover {
  color: #6d4db3;
}

nav a.active {
  color: #6d4db3;
  border-bottom: 3px solid #6d4db3;
}

.hero {
  text-align: center;
  padding: 40px 20px;
}

.main-section {
  max-width: 1200px;
  margin: auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 30px;
  padding: 20px;
}

.card {
  background: white;
  padding: 25px;
}

.map-wrapper {
  display: flex;
  justify-content: center;
}

#africaMap {
  width: 100%;
  height: 600px;
}

.center-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  background: #f7f3fb;
  padding: 30px;
  border-radius: 12px;
}

.center-name {
  font-size: 1.5rem;
  font-weight: bold;
  margin-bottom: 15px;
}

.center-description {
  margin-bottom: 20px;
  line-height: 1.6;
}

.center-btn {
  display: inline-block;
  background: #4b2e83;
  color: white;
  text-decoration: none;
  padding: 12px 24px;
  border-radius: 8px;
  font-weight: bold;
}

.center-btn:hover {
  background: #6d4db3;
}

.selected-country {
  font-size: 1.5rem;
  margin-bottom: 15px;
  text-align: center;
}

@media (max-width: 900px) {
  .main-section {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
<nav>
  <a href="./index.html">Home</a>
  <a href="./about.html">About</a>
  <a href="./members.html" class="active">Members</a>
  <a href="./projects.html">Projects</a>
  <a href="./Publications.html">Publications</a>
  <a href="./contact.html">Contact</a>
</nav>
</header>

<section class="hero">
<h1>Nephrica Consortium Centers Across Africa</h1>
<p>Click a country on the map to view participating centers.</p>
</section>

<section class="main-section">

<div class="card">
<h2>Africa Map</h2>

<div class="map-wrapper">
<object id="africaMap" data="./africa.svg" type="image/svg+xml"></object>
</div>
</div>

<div class="card">
<h2>Centers</h2>

<div id="memberContent">
<div class="selected-country">
Select a country
</div>
</div>

</div>

</section>

<script>
const centersData = {

  ET: {
    name: "Ethiopia",
    center: "Addis Ababa University",
    page: "ethiopia-center.html"
  },

  KE: {
    name: "Kenya",
    center: "Nairobi Hospital",
    page: "kenya-center.html"
  },

  CD: {
    name: "Congo",
    center: "Kinshasa University Hospital",
    page: "congo-center.html"
  }

};

function renderCenter(code) {

  const container = document.getElementById("memberContent");
  const country = centersData[code];

  container.innerHTML = `
    <div class="selected-country">
      ${country.name}
    </div>

    <div class="center-card">

      <div class="center-name">
        ${country.center}
      </div>

      <div class="center-description">
        Click below to view contributors and information for this center.
      </div>

      <a class="center-btn" href="${country.page}">
        View Center
      </a>

    </div>
  `;
}

document.getElementById("africaMap").addEventListener("load", function () {

  const svg = this.contentDocument;

  const allCodes = ["ET", "KE", "CD"];
  const baseColor = "#d9d1e8";

  allCodes.forEach(code => {

    const el = svg.getElementById(code);

    if (!el) return;

    el.style.fill = baseColor;
    el.style.stroke = "#fff";
    el.style.cursor = "pointer";

    el.addEventListener("mouseenter", () => {
      if (!el.dataset.active) {
        el.style.fill = "#6a42b8";
      }
    });

    el.addEventListener("mouseleave", () => {
      if (!el.dataset.active) {
        el.style.fill = baseColor;
      }
    });

    el.addEventListener("click", () => {

      allCodes.forEach(c => {

        const other = svg.getElementById(c);

        if (other) {
          other.dataset.active = "";
          other.style.fill = baseColor;
        }

      });

      el.dataset.active = "true";
      el.style.fill = "#d24ca3";

      renderCenter(code);

    });

  });

});
</script>

</body>
</html>
